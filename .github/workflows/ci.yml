name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rentwise
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentwise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rentwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rentwise:postgres@localhost:5432/rentwise_test?schema=public
      # Test-only values; production secrets come from the deploy environment.
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @rentwise/shared build

      - name: Generate Prisma client
        run: pnpm --filter @rentwise/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @rentwise/api exec prisma migrate deploy

      - name: Typecheck
        run: |
          pnpm --filter @rentwise/api exec tsc --noEmit
          pnpm --filter @rentwise/web exec tsc --noEmit

      - name: Unit tests
        run: pnpm -r test

      - name: Build apps
        run: |
          pnpm --filter @rentwise/api build
          pnpm --filter @rentwise/web build

  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: verify
    # Only publish from main; PRs stop at the verify job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
