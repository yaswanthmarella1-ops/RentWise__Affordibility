packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # esbuild's postinstall downloads the platform-specific binary Vite needs.
  esbuild: true
  # Prisma's postinstall fetches the query engine and generates the client.
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  # Analytics-only postinstall — nothing here needs it.
  '@scarf/scarf': false
